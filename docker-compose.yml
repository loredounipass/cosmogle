services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - backend

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - ./server/.env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - backend-redis:/data
    networks:
      - backend

  turn:
    image: coturn/coturn:latest
    container_name: turn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49160:49152-49160/udp"
    env_file:
      - ./server/.env
    entrypoint: ["sh", "-c"]
    command:
      - "turnserver -n --log-file=stdout --min-port=49152 --max-port=49160 --user=$${TURN_USERNAME}:$${TURN_CREDENTIAL} --realm=$${TURN_REALM} --lt-cred-mech"
    networks:
      - backend

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  backend-redis:
    driver: local